version: 1
components:
  comp_web_app:
    name: Web App
    kind: web_ui
    directory: apps/web
    stack:
      choices:
        styling: Tailwind CSS
        language: JavaScript/TypeScript
        framework: React
        package_manager: pnpm
        testing_tool_e2e: Playwright
        testing_tool_unit: vitest
  comp_workflow_api:
    name: Workflow API
    kind: api_service
    directory: services/workflow-api
    stack:
      choices:
        language: JavaScript/TypeScript
        framework: NestJS
        package_manager: pnpm
        testing_tool_e2e: Supertest
        testing_tool_unit: jest
      notes: Database owned by the separate Relational Database managed-service component
  comp_workflow_worker:
    name: Workflow Worker
    kind: worker
    directory: services/workflow-worker
    stack:
      choices:
        language: JavaScript/TypeScript
        package_manager: pnpm
        testing_tool_unit: jest
  comp_relational_database:
    name: Relational Database
    kind: managed_service
    stack:
      choices:
        managed_service: PostgreSQL on Amazon RDS
  comp_object_storage:
    name: Object Storage
    kind: managed_service
    stack:
      choices:
        managed_service: Amazon S3
  comp_job_queue:
    name: Job Queue
    kind: managed_service
    stack:
      choices:
        managed_service: Amazon SQS
  comp_identity_provider:
    name: Identity Provider
    kind: managed_service
    stack:
      choices:
        managed_service: Amazon Cognito (federating to each org's Entra ID/Okta/OIDC/SAML
          provider)
